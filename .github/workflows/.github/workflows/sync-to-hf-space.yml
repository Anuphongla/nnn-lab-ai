name: Sync to HF Space

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Push to Hugging Face Space
      run: |
        git remote add space https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Aruphongla/nnnlab-demi
        git push space main --force
